apiVersion: apps/v1
kind: Deployment
metadata:
  name: fanwaave-api-server
  namespace: fanwaave
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fanwaave-api-server
  template:
    metadata:
      labels:
        app: fanwaave-api-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/fanwaave/fanwaave-api-server.rs:main
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FANWAAVE_API_BIND
              value: "0.0.0.0:8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fanwaave-contact-runtime
                  key: database-url
            - name: FANWAAVE_CONTACT_ENQUEUE_SECRET
              valueFrom:
                secretKeyRef:
                  name: fanwaave-contact-runtime
                  key: enqueue-secret
            - name: FANWAAVE_NATS_URL
              valueFrom:
                secretKeyRef:
                  name: fanwaave-contact-runtime
                  key: nats-url
                  optional: true
            - name: RUST_LOG
              value: fanwaave_api_server=info
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
