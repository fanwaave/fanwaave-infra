name: Vector migration safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shadow-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify migration guards without database credentials
        run: sh scripts/test-vector-migration-guard.sh
